<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Cricket Toss - 3D Cricket Arcade Game in a Single Standalone HTML File." />
    <title>Cricket Toss - 3D Cricket Game</title>
    <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

html,
body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  min-height: 100%;
  overflow: hidden;
  background-color: #0f172a;
  color: #f0f0f0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
}

#app {
  position: relative;
  width: 100vw;
  width: 100dvw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
}

#canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  cursor: crosshair;
}

#canvas-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
  touch-action: none;
}

#ui-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

/* Animations */
@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes pulseGlow {
  0%, 100% {
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
  }
  50% {
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.7);
  }
}

/* Base button styles */
button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

button:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

button:active {
  transform: translateY(1px);
}

/* =========================================
   RESPONSIVE HUD & UI CLASSES
   ========================================= */

.arcade-hud {
  position: absolute;
  top: max(12px, calc(var(--safe-top) + 6px));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: auto;
  max-width: calc(100vw - 24px);
  padding: 8px 20px;
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 28px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  user-select: none;
  pointer-events: none;
  z-index: 20;
  font-family: system-ui, -apple-system, sans-serif;
  transition: all 0.2s ease;
}

.hud-divider {
  width: 1px;
  height: 22px;
  background: rgba(255, 255, 255, 0.15);
  flex-shrink: 0;
}

.power-meter {
  position: absolute;
  bottom: max(68px, calc(var(--safe-bottom) + 56px));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  flex-direction: column;
  align-items: center;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 14px;
  padding: 10px 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
  pointer-events: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 20;
  transition: opacity 0.2s ease;
}

.hint-banner {
  position: absolute;
  bottom: max(16px, calc(var(--safe-bottom) + 12px));
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #f1f5f9;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.5px;
  padding: 8px 20px;
  border-radius: 20px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
  pointer-events: none;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.25s ease;
  white-space: nowrap;
  max-width: calc(100vw - 32px);
  text-align: center;
  z-index: 20;
}

.game-modal-card {
  width: 380px;
  max-width: min(92vw, 380px);
  background: #0f172a;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
  text-align: center;
  font-family: system-ui, -apple-system, sans-serif;
  color: #f8fafc;
  animation: popIn 0.28s ease-out;
  max-height: 90dvh;
  overflow-y: auto;
}

/* =========================================
   MOBILE PORTRAIT OPTIMIZATIONS (< 600px)
   ========================================= */
@media (max-width: 600px) {
  .arcade-hud {
    top: max(8px, calc(var(--safe-top) + 4px));
    padding: 6px 12px;
    gap: 8px;
    border-radius: 20px;
    width: calc(100vw - 16px);
    justify-content: space-around;
  }

  .hud-divider {
    height: 18px;
  }

  #hud-round {
    font-size: 10px !important;
    padding: 3px 7px !important;
    letter-spacing: 0.5px !important;
  }

  #hud-attempts-balls .attempt-ball {
    width: 8px !important;
    height: 8px !important;
  }

  #hud-wind-container {
    padding: 3px 7px !important;
    gap: 4px !important;
  }

  #hud-wind-container span:first-child {
    font-size: 8px !important;
  }

  #hud-wind-label {
    font-size: 10px !important;
  }

  #hud-obstacle-badge {
    padding: 3px 6px !important;
    gap: 3px !important;
  }

  #hud-obstacle-badge span:last-child {
    font-size: 8px !important;
  }

  #hud-score {
    font-size: 17px !important;
  }

  #hud-best {
    font-size: 14px !important;
  }

  .power-meter {
    bottom: max(62px, calc(var(--safe-bottom) + 52px));
    padding: 8px 14px;
    border-radius: 12px;
  }

  .power-meter-inner {
    width: 170px !important;
  }

  .hint-banner {
    bottom: max(14px, calc(var(--safe-bottom) + 8px));
    font-size: 11px;
    padding: 6px 14px;
    letter-spacing: 0.2px;
  }

  .game-modal-card {
    padding: 20px 16px;
    border-radius: 16px;
  }

  #modal-title {
    font-size: 20px !important;
  }

  #modal-stat-round-score,
  #modal-stat-bonus,
  #modal-stat-total-score,
  #modal-stat-best-score {
    font-size: 17px !important;
  }
}

/* Extra compact for narrow phones (< 380px) */
@media (max-width: 380px) {
  .arcade-hud {
    padding: 5px 8px;
    gap: 5px;
  }

  .hud-label-text {
    display: none;
  }

  #hud-score {
    font-size: 15px !important;
  }

  #hud-best {
    font-size: 12px !important;
  }
}

    </style>
  </head>

      <div id="canvas-container"></div>
      <div id="ui-overlay"></div>
    </div>
